# Fiche de paie — régime CNSS non agricole (RSNA) — revenus 2025.
#
# Règles (voir docs/notes/desaccords.md) :
#   - CNSS salariale 9,68 % (9,18 % + 0,5 % perte d'emploi, LF2025 art. 17) — D1
#   - cotisation perte d'emploi déductible du revenu imposable — D2
#   - barème IRPP des revenus 2025 (8 tranches, LF2025) pour la retenue à la source — D3
#   - abattement frais professionnels 10 %, plafonné 2000 DT/an
#
# Valeurs attendues = moteur OpenFisca-Tunisia (droit 2025). Cas comparés hors
# dépôt à des simulateurs ayant intégré la LF2025 (voir sources_locales/).
#
# Validation croisée (voir sources_locales/) : une fois la CNSS neutralisée,
# le barème IRPP et la CSS sont alignés AU CENTIME avec les simulateurs en
# ligne. Les simulateurs restés à 9,18 % en 2025 donnent un net supérieur de
# 4 à 15 DT selon le brut (+0,5 pt CNSS déductible non appliqué) — obsolète
# pour les revenus 2025 (cf. docs/notes/desaccords.md, D1/D2).

- name: RSNA 2025 — brut 1000, célibataire
  period: 2025-01
  absolute_error_margin: 0.01
  input:
    regime_securite_sociale_cotisant: rsna
    salaire_de_base: 1000
  output:
    cotisations_salarie: 96.80
    salaire_imposable: 903.20
    irpp_salarie_preleve_a_la_source: 59.4320
    contribution_sociale_solidarite_prelevee_a_la_source: 4.0644
    salaire_net_a_payer: 839.7036

