# Profil avec charges de famille : chef de famille + 2 enfants à charge.
# nb_enf et chef_de_famille sont des variables annuelles : on date l'année
# complète et le salaire mensuel sur janvier.
- name: RSNA 2024 — brut 1500/mois, chef de famille, 2 enfants
  period: 2024
  absolute_error_margin: 0.01
  input:
    regime_securite_sociale_cotisant:
      2024-01: rsna
    salaire_de_base:
      2024-01: 1500
    chef_de_famille: true
    nb_enf: 2
  output:
    irpp_salarie_preleve_a_la_source:
      2024-01: 199.6116
    salaire_net_a_payer:
      2024-01: 1156.7665
