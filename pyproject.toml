[project]
name = "tunisie-simulateur-paie"
version = "0.1.0"
description = "Simulateurs de fiche de paie, d'impôt et de retraite pour la Tunisie, basés sur OpenFisca-Tunisia et Shiny for Python"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Mahdi Ben Jelloul" }]
dependencies = [
    "shiny>=1.0",
    "openfisca-tunisia>=0.159",
    "openfisca-core[web-api]>=43",
    "httpx>=0.27",
    "matplotlib>=3.11.2",
]

[project.urls]
Homepage = "https://github.com/benjello/tunisie-simulateur-paie"
Repository = "https://github.com/benjello/tunisie-simulateur-paie"

[dependency-groups]
# Outils de build / export statique (non embarqués dans l'app WebAssembly)
dev = [
    "shinylive>=0.5",
    "pytest>=8",
]

[tool.uv]
# Rien de spécifique pour l'instant.
