name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Vérifier la synchro des agents
        run: bash scripts/deploy_agents.sh --check

      - name: Tests YAML OpenFisca (paie)
        run: uv run openfisca test tests/paie/ -c openfisca_tunisia

      - name: Tests pytest (inversion net→brut, mode local)
        env:
          OPENFISCA_MODE: local
        run: uv run python -m pytest tests/ -q
